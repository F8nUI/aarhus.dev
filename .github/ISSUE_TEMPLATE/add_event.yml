name: Add Event
description: Submit a tech event in Aarhus — a maintainer adds it to the site
title: "[Event]: "
labels: ["content", "event"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding an event! Fill this in and a maintainer turns it into an event on the site.
        Prefer to open a pull request yourself? See https://aarhus.dev/add-event.

        Leave out anything that isn't announced yet — the site shows "TBA".

  - type: input
    id: title
    attributes:
      label: Event title
      placeholder: e.g., Talk Night at EIVA
    validations:
      required: true

  - type: input
    id: subtitle
    attributes:
      label: Subtitle
      description: Optional line under the title
      placeholder: e.g., Morning Meetup
    validations:
      required: false

  - type: input
    id: topic
    attributes:
      label: Topic
      description: |
        The language or field, e.g. rust, ai, dotnet, security. The existing topics are the folders in
        https://github.com/f8nui/aarhus.dev/tree/main/src/content/event — a new one is fine.
      placeholder: e.g., rust
    validations:
      required: true

  - type: input
    id: organizer
    attributes:
      label: Organizer
      description: |
        The community or company hosting it. If it's already on aarhus.dev, its id from
        https://github.com/f8nui/aarhus.dev/tree/main/src/content/organizer helps (e.g. rust-aarhus).
      placeholder: e.g., Rust Aarhus
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      description: The first day, for an event that runs several days
      placeholder: YYYY-MM-DD, e.g., 2027-02-15
    validations:
      required: true

  - type: input
    id: endDate
    attributes:
      label: End date
      description: Only for an event that runs several days
      placeholder: YYYY-MM-DD
    validations:
      required: false

  - type: input
    id: startTime
    attributes:
      label: Start time
      description: Aarhus local time, 24-hour
      placeholder: e.g., 18:00
    validations:
      required: false

  - type: input
    id: endTime
    attributes:
      label: End time
      description: Aarhus local time, 24-hour
      placeholder: e.g., 21:00
    validations:
      required: false

  - type: input
    id: venue_title
    attributes:
      label: Venue
      placeholder: e.g., EIVA
    validations:
      required: false

  - type: input
    id: venue_address
    attributes:
      label: Venue address
      placeholder: e.g., Niels Bohrs Vej 17, 8660 Skanderborg
    validations:
      required: false

  - type: input
    id: learnMoreURL
    attributes:
      label: Event link
      description: Where people sign up or read more
      placeholder: https://...
    validations:
      required: true

  - type: dropdown
    id: linkFor
    attributes:
      label: What the link is for
      description: It names the link on the event's page. Leave it empty if none fits; the link then says "Event page".
      options:
        - Signing up ("Sign up")
        - Tickets ("Get tickets")
        - More about the event ("Read more")
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What the event is about — talks, agenda, who it's for. Markdown works.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The details match the organizer's own event page
          required: true
